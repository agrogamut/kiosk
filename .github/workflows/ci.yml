name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  lint-typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build --workspace @madamgy/api-client
      - run: npm run db:generate --workspace @madamgy/server
      - run: npm run typecheck
      - run: npm run lint

  test-server:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: madamgy
          POSTGRES_PASSWORD: madamgy
          POSTGRES_DB: madamgy_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
    env:
      DATABASE_URL: postgresql://madamgy:madamgy@localhost:5432/madamgy_test
      REDIS_URL: redis://localhost:6379
      JWT_ACCESS_SECRET: ci-test-secret-aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
      JWT_REFRESH_SECRET: ci-test-secret-bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb
      NODE_ENV: test
      ADMIN_PHONE: "9000000000"
      ADMIN_PASSWORD: admin123
      RAZORPAY_KEY_ID: ${{ secrets.RAZORPAY_TEST_KEY_ID }}
      RAZORPAY_KEY_SECRET: ${{ secrets.RAZORPAY_TEST_KEY_SECRET }}
      RAZORPAY_WEBHOOK_SECRET: ${{ secrets.RAZORPAY_TEST_WEBHOOK_SECRET }}
      MINIO_ENDPOINT: localhost
      MINIO_PORT: "19000"
      MINIO_ACCESS_KEY: madamgy
      MINIO_SECRET_KEY: madamgy123
      MINIO_BUCKET: madamgy
      MINIO_USE_SSL: "false"
      LIVEKIT_HOST: "ws://localhost:7880"
      LIVEKIT_API_KEY: devkey
      LIVEKIT_API_SECRET: devsecretdevsecretdevsecret
      WEB_URL: "*"
      REQUIRE_PAYMENT_FOR_CALLS: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build --workspace @madamgy/api-client
      - run: npm run db:generate --workspace @madamgy/server
      - run: npm run db:migrate:deploy --workspace @madamgy/server
      - run: npm run db:seed --workspace @madamgy/server
      - run: docker run -d --name madamgy-ci-minio -e MINIO_ROOT_USER=madamgy -e MINIO_ROOT_PASSWORD=madamgy123 -p 19000:9000 minio/minio server /data
      - run: npm run test --workspace @madamgy/server

  build-android-apk:
    runs-on: ubuntu-latest
    env:
      VITE_API_URL: https://kiosk-production-060d.up.railway.app/api
      VITE_SOCKET_URL: https://kiosk-production-060d.up.railway.app
      # Baked into the bundle at build time. Without it the APK dials ws://localhost:7880 and no
      # call ever connects -- see packages/web/src/lib/livekitUrl.ts. Not a secret: this is the
      # public signalling URL clients dial, and it is useless without the API key/secret, which
      # live only on the server. Kept inline alongside the other two URLs above for that reason.
      VITE_LIVEKIT_URL: wss://kiosk-iq6jq9cr.livekit.cloud
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - run: npm ci
      - run: npm run build --workspace @madamgy/api-client
      - run: npm run build --workspace @madamgy/web
      - run: npx cap sync android
        working-directory: packages/kiosk-android
      - run: chmod +x gradlew && ./gradlew assembleDebug
        working-directory: packages/kiosk-android/android
      - uses: actions/upload-artifact@v7
        with:
          name: madamgy-debug-apk
          path: packages/kiosk-android/android/app/build/outputs/apk/debug/app-debug.apk

  build-android-release-apk:
    runs-on: ubuntu-latest
    env:
      VITE_API_URL: https://kiosk-production-060d.up.railway.app/api
      VITE_SOCKET_URL: https://kiosk-production-060d.up.railway.app
      # Baked into the bundle at build time. Without it the APK dials ws://localhost:7880 and no
      # call ever connects -- see packages/web/src/lib/livekitUrl.ts. Not a secret: this is the
      # public signalling URL clients dial, and it is useless without the API key/secret, which
      # live only on the server. Kept inline alongside the other two URLs above for that reason.
      VITE_LIVEKIT_URL: wss://kiosk-iq6jq9cr.livekit.cloud
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - run: npm ci
      - run: npm run build --workspace @madamgy/api-client
      - run: npm run build --workspace @madamgy/web
      - run: npx cap sync android
        working-directory: packages/kiosk-android
      # Every signing input is checked up front. Gradle reports a missing password, an empty
      # keystore and a corrupt keystore identically -- as
      # "KeytoolException: ... Tag number over 30 is not supported" -- because a wrong password
      # decrypts the PKCS12 into bytes that only fail later, during ASN.1 parsing. That error
      # names the keystore file whatever the real cause was, so without these checks a missing
      # password sends you hunting a file that was never the problem.
      - name: Check signing secrets are present
        run: |
          missing=""
          for name in ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_PASSWORD ANDROID_KEY_ALIAS; do
            if [ -z "${!name}" ]; then
              missing="$missing $name"
            fi
          done
          if [ -n "$missing" ]; then
            echo "::error::Missing or empty repository secret(s):$missing"
            echo "All four must be set on THIS repository -- secrets are per-repo and are not shared with a fork or mirror."
            exit 1
          fi
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      - run: |
          mkdir -p packages/kiosk-android/android/keystore
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > packages/kiosk-android/android/keystore/madamgy-release.keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      - run: |
          cat > packages/kiosk-android/android/key.properties <<EOF
          storePassword=$ANDROID_KEYSTORE_PASSWORD
          keyPassword=$ANDROID_KEY_PASSWORD
          keyAlias=$ANDROID_KEY_ALIAS
          storeFile=keystore/madamgy-release.keystore
          EOF
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      # Fails here, naming the password, rather than 90 seconds later inside Gradle naming the file.
      - name: Verify the keystore decodes and the password opens it
        run: |
          keytool -list \
            -keystore packages/kiosk-android/android/keystore/madamgy-release.keystore \
            -storepass "$ANDROID_KEYSTORE_PASSWORD" \
            -alias "$ANDROID_KEY_ALIAS" > /dev/null
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      - run: chmod +x gradlew && ./gradlew assembleRelease
        working-directory: packages/kiosk-android/android
      - uses: actions/upload-artifact@v7
        with:
          name: madamgy-release-apk
          path: packages/kiosk-android/android/app/build/outputs/apk/release/app-release.apk

  dependency-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm audit --omit=dev --audit-level=high
