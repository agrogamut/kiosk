port: 7880
rtc:
  tcp_port: 7881
  port_range_start: 40000
  port_range_end: 49999
  use_external_ip: true
  stun_servers:
    - stun.l.google.com:19302
# The kiosk and the doctor are normally on different networks (different NATs), not a shared
# LAN, so ICE needs a relay it can fall back to when a direct peer connection can't be
# established. LiveKit's embedded TURN server covers that without standing up coturn separately.
turn:
  enabled: true
  udp_port: 3478
keys:
  devkey: c063bccf7164bfcaa205cd629a5725ac2667d8131eb5682e
logging:
  level: warn
# Fires room_finished (and other) events at the backend's webhook endpoint so it can clean up
# calls LiveKit itself decided to end (e.g. departure timeout) even when nobody explicitly
# closed the room from the app. The api_key here must be one of the keys above -- LiveKit signs
# webhook payloads with it so the receiver can verify authenticity.
# network_mode is `host` for this service in docker-compose.yml, so it shares the host's network
# namespace and can reach the dev server directly via localhost.
# In production, point the equivalent config (self-hosted livekit.yaml or LiveKit Cloud's
# webhook settings) at the deployed backend's own /api/webhooks/livekit URL -- that's a
# deployment-time step outside this repo's automation.
webhook:
  api_key: devkey
  urls:
    - http://localhost:3000/api/webhooks/livekit
