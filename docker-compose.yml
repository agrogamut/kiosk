services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: madamgy
      POSTGRES_PASSWORD: madamgy
      POSTGRES_DB: madamgy
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "55432:5432"

  redis:
    image: redis:7-alpine
    ports:
      - "56379:6379"

  livekit:
    image: livekit/livekit-server:latest
    command: --config /etc/livekit.yaml
    network_mode: host
    volumes:
      - ./livekit/livekit.yaml:/etc/livekit.yaml

  minio:
    image: minio/minio
    command: server /data --console-address :9001
    environment:
      MINIO_ROOT_USER: madamgy
      MINIO_ROOT_PASSWORD: madamgy123
    ports:
      - "19000:9000"
      - "19001:9001"
    volumes:
      - minidata:/data

  api:
    build:
      context: .
      dockerfile: packages/server/Dockerfile
    depends_on:
      - postgres
      - redis
      - minio
      - livekit
    env_file: .env
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://madamgy:madamgy@postgres:5432/madamgy
      REDIS_URL: redis://redis:6379
      MINIO_ENDPOINT: minio
      MINIO_PORT: 9000
    ports:
      - "3000:3000"
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: packages/web/Dockerfile
    depends_on:
      - api
    restart: unless-stopped

volumes:
  pgdata:
  minidata:
